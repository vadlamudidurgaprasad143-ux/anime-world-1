<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime World - Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=MedievalSharp&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Poppins', sans-serif;

            background-image: url("{{ url_for('static', filename='image/background.jpeg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .signup-container {
            width: 370px;
            padding: 30px;
            text-align: center;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #b8860b;
            margin-bottom: 15px;
            box-shadow: 0 0 25px black;
        }

        h1 {
            color: white;
            font-family: 'Cinzel', serif;
            margin-bottom: 25px;
        }

        .error {
            color: white;
            background: rgba(150, 0, 0, 0.85);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .input-box {
            margin-bottom: 18px;
            padding: 10px 12px;

            background: linear-gradient(
                180deg,
                #fbf4d8,
                #eadaa2
            );

            border: 2px solid #8b5a2b;
            border-radius: 5px;

            text-align: left;
        }

        .input-box label {
            display: block;
            margin-bottom: 5px;

            color: #2b1810;

            font-family: 'MedievalSharp', cursive;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 8px;

            border: none;
            outline: none;
            background: transparent;

            color: #3d2612;
            font-size: 15px;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;

            border: 2px solid #b8860b;
            border-radius: 25px;

            background: linear-gradient(
                180deg,
                #333333,
                #111111
            );

            color: white;

            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 15px;

            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px #b8860b;
        }

        /* Google Button */

        .google-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 25px;

            background: white;
            color: #222;

            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.3s;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            text-decoration: none;
        }

        .google-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px white;
        }

        .google-icon {
            font-size: 20px;
            font-weight: bold;
            color: #4285F4;
        }

        .login-link {
            display: block;
            margin-top: 20px;

            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link:hover {
            color: #00d4ff;
        }
    </style>
</head>

<body>

<div class="signup-container">

    <img
        src="{{ url_for('static', filename='image/logo.jpeg') }}"
        class="logo"
        alt="Anime World"
    >

    <h1>Create Account</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form
        action="{{ url_for('signup') }}"
        method="POST"
    >

        <div class="input-box">
            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >
        </div>

        <div class="input-box">
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >
        </div>

        <div class="input-box">
            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >
        </div>

        <button
            type="submit"
            class="signup-btn"
        >
            CREATE ACCOUNT
        </button>

    </form>

    <!-- Continue With Google -->

    <a
        href="#"
        class="google-btn"
    >
        <span class="google-icon">G</span>
        Continue with Google
    </a>

    <a
        href="{{ url_for('login') }}"
        class="login-link"
    >
        Already have an account? Login
    </a>

</div>

</body>
</html>
